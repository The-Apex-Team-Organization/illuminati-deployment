apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backend-prod
  namespace: illuminati
spec:
  project: illuminati

  sources:
    - repoURL: https://github.com/The-Apex-Team-Organization/illuminati-helm-charts
      targetRevision: main
      path: backend
      helm:
        valueFiles:
          - $values/vars/prod/backend/values.yaml

    - repoURL: https://github.com/The-Apex-Team-Organization/illuminati-deployment.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: illuminati

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
